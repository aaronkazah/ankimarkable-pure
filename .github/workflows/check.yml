name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  paper-pure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ankimarkable-pure-paper-pure
          path: |
            dist/ankimarkable-pure-0.4.0-paper-pure.tar.gz
            dist/SHA256SUMS
