[package]
name = "ankimarkable-pure"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "ankimarkable-pure"
description = "Anki review client for the reMarkable Paper Pure (AppLoad/QTFB app)"


[dependencies]
anki = { git = "https://github.com/ankitects/anki", tag = "25.09.4", default-features = false, features = ["rustls"] }
anki_proto = { git = "https://github.com/ankitects/anki", tag = "25.09.4" }

blitz-dom = "0.2"
blitz-html = "0.2"
blitz-paint = "0.2"
blitz-traits = "0.2"
parley = "0.6"
anyrender = "0.6"
anyrender_vello_cpu = "0.7"
png = "0.17"

reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
libc = "0.2"

rusqlite = { version = "0.36", features = ["bundled"] }

resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "unwind"
